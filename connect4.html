<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect 4 — Minimax AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="connect4.css">
</head>
<body>
<div class="container">

  <header>
    <h1>CONNECT 4</h1>
    <div class="subtitle">Minimax AI</div>
  </header>

    <div class="scoreboard">
        <div class="score-card active-player" id="player-card">
        <div class="label">You</div>
        <div class="name">PLAYER</div>
        <div class="score-num" id="player-score">0</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="score-card" id="ai-card">
        <div class="label">Computer</div>
        <div class="name">AI</div>
        <div class="score-num" id="ai-score">0</div>
        </div>
    </div>

    <div class="difficulty-row">
        DEPTH:
        <button class="diff-btn selected" data-depth="3">EASY</button>
        <button class="diff-btn" data-depth="5">MEDIUM</button>
        <button class="diff-btn" data-depth="7">HARD</button>
    </div>

    <div class="status-bar player-turn" id="status">YOUR TURN</div>

    <div class="board-wrapper">
        <div class="drop-indicators" id="arrows">
            <div class="drop-arrow" id="arr-0">▼</div>
            <div class="drop-arrow" id="arr-1">▼</div>
            <div class="drop-arrow" id="arr-2">▼</div>
            <div class="drop-arrow" id="arr-3">▼</div>
            <div class="drop-arrow" id="arr-4">▼</div>
            <div class="drop-arrow" id="arr-5">▼</div>
            <div class="drop-arrow" id="arr-6">▼</div>
        </div>
        <div class="board" id="board"></div>
    </div>

    <div class="controls">
        <button class="primary" id="restart-btn">↺  NEW GAME</button>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-dot player"></div> Player</div>
        <div class="legend-item"><div class="legend-dot ai"></div> AI (Minimax)</div>
    </div>

</div>
<script src="connect4.js"></script>
</body>
